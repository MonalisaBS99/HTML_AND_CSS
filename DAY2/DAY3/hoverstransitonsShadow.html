<style>
    .sub-button{
    background-color:rgb(200, 13, 13);
    color:white;
    border:none;
    width:100px;
    height: 30px;
    border-radius :3px;
    cursor:pointer;
    margin-right:7px;
    transition: opacity 0.15s;
    }
    .join-button{
        background-color:white;
        color:rgb(7, 152, 249);
        border-radius:2px;
        width:60px;
        height:30px;
        border-color:rgb(7, 152, 249);
        border-style:solid;
        border-width:1px;
        cursor:pointer;
        margin-right:7px;
        transition :background-color 1s,color 1s;
    }
    .tweet-button{
        background-color:rgb(0, 136, 255);
        color:white;
        height:34px;
        width:70px;
        border-radius:20px;
        border:none;
        cursor:pointer;
        font-weight:bold;
        font-size:15px;
        box-shadow: 4px 4px 10px rgba(0,0,0,0.15);
    }
    .sub-button:hover{
        opacity:0.8;
    }
    .sub-button:active{
        opacity:0.3;
    }
    .join-button:hover{
        background-color:rgb(7, 152, 249);
        color:white;
    }
    .join-button:active{
        opacity:0.8;
    }
</style>
<button class="sub-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>
